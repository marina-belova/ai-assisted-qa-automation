name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run the controlled drift test
        if: ${{ github.head_ref == 'feature/block14-controlled-locator-drift' || github.ref_name == 'feature/block14-controlled-locator-drift' }}
        run: npx playwright test tests/ds1-create-program.spec.ts -g "TC-001:" --project=chromium --retries=0

      - name: Run the full suite
        if: ${{ github.head_ref != 'feature/block14-controlled-locator-drift' && github.ref_name != 'feature/block14-controlled-locator-drift' }}
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
